services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mizant
      POSTGRES_PASSWORD: mizant
      POSTGRES_DB: mizant
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mizant']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ['mizant-postgres:/var/lib/postgresql/data']
  redis:
    image: redis:7.4-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mizant-postgres:
